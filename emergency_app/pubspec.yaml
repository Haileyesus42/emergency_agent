name: emergency_app
description: "A new Flutter project for the Emergency Agent app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Core dependencies
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  
  # UI and fonts
  google_fonts: ^6.1.0
  
  # Utilities
  url_launcher: ^6.2.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
