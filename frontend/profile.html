<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Umojee Emergency - Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-container">
        <div class="app-container">
            <!-- Header -->
            <header class="app-header">
                <div class="header-content">
                    <div class="logo-small">🚨</div>
                    <div class="header-text">
                        <h1>Umojee</h1>
                        <p>Emergency Management System</p>
                    </div>
                </div>
                <!-- Emergency SOS Button -->
                <div class="emergency-section">
                    <button id="emergencyBtn" class="btn btn-emergency" title="Emergency SOS">
                        <span class="emergency-icon">🚨</span>
                    </button>
                </div>
            </header>
        
        <!-- Navigation Tabs -->
        <nav class="app-nav">
            <a href="/profile.html" class="nav-tab active">
                <span class="tab-icon">👤</span>
                <span class="tab-label">Profile</span>
            </a>
            <a href="/contacts.html" class="nav-tab">
                <span class="tab-icon">📞</span>
                <span class="tab-label">Contacts</span>
            </a>
            <button onclick="logout()" class="nav-tab logout-btn">
                <span class="tab-icon">🚪</span>
                <span class="tab-label">Logout</span>
            </button>
        </nav>
        
        <!-- Main Content -->
        <main class="app-content">
            <div class="profile-card">
                <div class="card-header">
                    <h2>User Profile</h2>
                    <p class="card-subtitle">Manage your personal information</p>
                </div>
                
                <form id="profileForm" class="profile-form">
                    <div class="form-group">
                        <label for="fullName">
                            <span class="icon">👤</span> Full Name
                        </label>
                        <input type="text" id="fullName" name="full_name" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">
                            <span class="icon">🏠</span> Address
                        </label>
                        <input type="text" id="address" name="address" placeholder="Enter your address">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">
                            <span class="icon">📱</span> Phone
                        </label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">
                            <span class="icon">✉️</span> Email
                        </label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>
                    
                    <div class="form-divider"></div>
                    <p class="section-title">Current Location</p>
                    
                    <div class="form-group">
                        <label for="currentCity">
                            <span class="icon">🏙️</span> Current City
                        </label>
                        <input type="text" id="currentCity" name="current_city" placeholder="Enter current city">
                    </div>
                    
                    <div class="form-group">
                        <label for="currentCountry">
                            <span class="icon">🌍</span> Current Country
                        </label>
                        <input type="text" id="currentCountry" name="current_country" placeholder="Enter current country">
                    </div>
                    
                    <div class="form-divider"></div>
                    <p class="section-title">Accommodation</p>
                    
                    <div class="form-group">
                        <label for="hotelName">
                            <span class="icon">🏨</span> Hotel Name
                        </label>
                        <input type="text" id="hotelName" name="hotel_name" placeholder="Enter hotel name">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <span>💾 Save Changes</span>
                    </button>
                </form>
                
                <div id="successMessage" class="success-message" style="display: none;"></div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </main>
        </div>
    </div>
    
    <!-- Snackbar Notification -->
    <div id="snackbar" class="snackbar"></div>
    
    <script src="/static/app.js"></script>
</body>
</html>
